<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08131a">
<title>Crew Quarters · Rift Runner</title>
<link rel="icon" type="image/png" href="./rift-192.png">
<link rel="stylesheet" href="./carrier-crew.css?v=99">
<script src="./carrier-crew.js?v=99" defer></script>
</head>
<body>
<main class="quarters" aria-labelledby="quarters-title">
 <header class="quarters-header">
  <h1 id="quarters-title">Crew Quarters</h1>
  <a class="control carrier-link" href="./carrier.html">← Carrier</a>
 </header>
 <div class="room-stage">
  <section class="room" data-room="Crew Berths" aria-label="Crew Berths">
   <div class="room-lower room-lower-berths" aria-hidden="true"></div>
   <div class="room-upper">
    <img src="./crew-berths.webp?v=95" width="1672" height="941" alt="The carrier crew’s sleeping berths." fetchpriority="high">
    <button class="honor-board" id="crew-honors" type="button" aria-haspopup="dialog" aria-controls="crew-distinction"><span aria-hidden="true">✦</span> Honors</button>
   </div>
  </section>
  <section class="room" data-room="Common Room" aria-label="Common Room" hidden>
   <div class="room-lower room-lower-common" aria-hidden="true"></div>
   <div class="room-upper">
    <img src="./crew-common.webp?v=95" width="1672" height="941" alt="The common room, with seating and a pilot ranks pinboard.">
    <button class="pinboard" id="crew-pinboard" type="button" aria-haspopup="dialog" aria-controls="crew-ranks"><span class="control">Pilot ranks</span></button>
   </div>
  </section>
  <section class="room" data-room="Galley" aria-label="Galley" hidden>
   <div class="room-lower room-lower-galley" aria-hidden="true"></div>
   <div class="room-upper">
    <img src="./crew-galley.webp?v=95" width="1672" height="941" alt="The carrier’s galley and kitchen.">
   </div>
  </section>
  <section class="room" data-room="Observation Lounge" aria-label="Observation Lounge" hidden>
   <picture class="room-upper room-observation-view">
    <source media="(orientation: portrait)" srcset="./crew-observation-portrait.webp?v=97" width="941" height="1672">
    <img src="./crew-observation.webp?v=95" width="1672" height="941" alt="The observation lounge looks out on deep space.">
   </picture>
  </section>
 </div>
 <nav class="room-nav" aria-label="Crew quarters rooms">
  <button class="control arrow" id="crew-prev" type="button" aria-label="Previous room">←</button>
  <p id="crew-room-label" role="status" aria-atomic="true">Crew Berths</p>
  <button class="control arrow" id="crew-next" type="button" aria-label="Next room">→</button>
 </nav>
 <dialog id="crew-ranks" aria-labelledby="crew-ranks-title">
  <h2 id="crew-ranks-title">Pilot Ranks</h2>
  <dl class="rank-list">
   <div data-min-kills="0"><dt>Cadet</dt><dd>0 kills</dd></div>
   <div data-min-kills="10"><dt>Wingman</dt><dd>10 kills</dd></div>
   <div data-min-kills="25"><dt>Ace</dt><dd>25 kills</dd></div>
   <div data-min-kills="50"><dt>Flight Lead</dt><dd>50 kills</dd></div>
   <div data-min-kills="75"><dt>Veteran</dt><dd>75 kills</dd></div>
   <div data-min-kills="150"><dt>Vanguard</dt><dd>150 kills</dd></div>
   <div data-min-kills="300"><dt>Rift Legend</dt><dd>300 kills</dd></div>
  </dl>
  <form method="dialog"><button class="control" autofocus>Close</button></form>
 </dialog>
 <dialog class="distinction" id="crew-distinction" aria-labelledby="crew-distinction-title">
  <header><span aria-hidden="true">✦</span><p>Combat distinction</p></header>
  <h2 id="crew-distinction-title">Untouched Legend</h2>
  <p>Clear all six waves of the Vandul Duel without taking any hull damage.</p>
  <form method="dialog"><button class="control" autofocus>Close</button></form>
 </dialog>
</main>
</body>
</html>
