<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rift Runner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Carrier · Rift Runner</title>
<meta name="description" content="An exterior view of the Rift Runner carrier and your fighter’s home berth.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./rift-192.png">
<link rel="apple-touch-icon" href="./rift-180.png">
<link rel="stylesheet" href="./carrier.css?v=10">
<script src="./pilot-credits.js?v=3" defer></script>
<script src="./carrier-view.js?v=4" defer></script>
<script src="./carrier-audio.js?v=4" defer></script>
<script src="./carrier-particles.js?v=1" defer></script>
</head>
<body>
<main class="carrier-view" aria-labelledby="carrier-title">
 <div class="carrier-passers" id="carrier-passers" aria-hidden="true"></div>
 <div class="carrier-art">
  <div class="carrier-scene" id="carrier-scene" data-angle="exterior">
   <div class="carrier-exhaust" aria-hidden="true"><span class="engine-1"></span><span class="engine-2"></span><span class="engine-3"></span><span class="engine-4"></span></div>
   <img class="carrier-hull" id="carrier-exterior-image" src="./carrier-scene.webp" width="1024" height="1536" alt="Exterior view of the carrier in deep space, with its lit aft hangar." fetchpriority="high">
   <img class="carrier-hull" id="carrier-extra-1-image" src="./carrier-extra-1.webp" width="1024" height="1536" alt="" aria-hidden="true" fetchpriority="low" hidden>
   <img class="carrier-hull" id="carrier-mid-1-image" src="./carrier-mid-1.webp" width="1024" height="1536" alt="" aria-hidden="true" fetchpriority="low" hidden>
   <img class="carrier-hull" id="carrier-extra-2-image" src="./carrier-extra-2.webp" width="1024" height="1536" alt="" aria-hidden="true" fetchpriority="low" hidden>
   <img class="carrier-hull" id="carrier-mid-2-image" src="./carrier-mid-2.webp" width="1024" height="1536" alt="" aria-hidden="true" fetchpriority="low" hidden>
   <img class="carrier-hull" id="carrier-extra-3-image" src="./carrier-extra-3.webp" width="1024" height="1536" alt="" aria-hidden="true" fetchpriority="low" hidden>
   <img class="carrier-hull" id="carrier-top-image" src="./carrier-top.webp" width="1024" height="1536" alt="Direct top view of the carrier and its lit aft hangar." fetchpriority="auto" hidden>
   <div class="carrier-lights" aria-hidden="true"><span class="carrier-light-bridge"></span><span class="carrier-light-bay"></span><span class="carrier-light-bayport"></span><span class="carrier-light-baystarboard"></span><span class="carrier-engine-glow engine-1"></span><span class="carrier-engine-glow engine-2"></span><span class="carrier-engine-glow engine-3"></span><span class="carrier-engine-glow engine-4"></span></div>
  </div>
 </div>
 <header class="carrier-header">
  <div class="carrier-ident">
   <p class="carrier-kicker">Rift Runner <span aria-hidden="true">/</span> <span id="carrier-angle-label">Exterior view</span></p>
   <h1 id="carrier-title">Carrier</h1>
   <p class="carrier-pilot-credits" id="carrier-pilot-credits" aria-live="polite" aria-atomic="true" hidden><span>Pilot credits</span><strong id="carrier-credit-value">0</strong></p>
  </div>
  <a class="carrier-back" href="./index.html"><span aria-hidden="true">←</span> Main Menu</a>
 </header>
 <footer class="carrier-footer">
  <div class="carrier-left-rail">
   <div class="carrier-launch-actions" role="group" aria-label="Launch fighter">
    <a class="carrier-berth carrier-status" id="carrier-launch-practice" href="./index.html?launch=practice">Practice Alone</a>
    <a class="carrier-berth carrier-status carrier-launch-primary" id="carrier-launch-vandul" href="./index.html?launch=vandul">Fight Vandul</a>
   </div>
   <a class="carrier-berth carrier-status carrier-shop-entry" id="carrier-shop" href="./carrier-shop.html">Shop</a>
  </div>
  <div class="carrier-side-utilities">
   <div class="carrier-actions">
    <a class="carrier-berth carrier-status" id="carrier-hangar" href="./index.html?hangar=carrier">
     <span class="carrier-signal" aria-hidden="true"></span>Hangar <span aria-hidden="true" class="carrier-berth-arrow">→</span>
    </a>
    <button class="carrier-berth carrier-status carrier-engine" id="carrier-engine-sound" type="button" data-state="off" aria-pressed="false" hidden>
     <span class="carrier-engine-label">Engine Sound</span> <span id="carrier-engine-state" aria-hidden="true">Off</span>
    </button>
    <p class="carrier-visually-hidden" id="carrier-engine-feedback" role="status">Engine sound is off.</p>
   </div>
   <fieldset class="carrier-views" id="carrier-views" hidden>
    <legend class="carrier-visually-hidden">Carrier view</legend>
    <label><input type="radio" name="carrier-angle" value="exterior" checked><span>Exterior</span></label>
    <label><input type="radio" name="carrier-angle" value="top"><span>Top View</span></label>
   </fieldset>
  </div>
 </footer>
</main>
</body>
</html>
