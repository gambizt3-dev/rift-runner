<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online Battle Fleet Map · Rift Runner</title>
<script src="./pilot-credits.js?v=252" data-read-only defer></script>
<script src="./fighter-registry.js?v=254" defer></script>
<script src="./fighter-parking.js?v=2" defer></script>
<script src="./ship-definitions.js?v=3" defer></script>
<script src="./fleet-space-beta.js?v=online-touch-flight-1" defer></script>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#080f1d;color:#e0f5ff}
body{max-width:38rem;margin:auto;padding:1rem}
button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 .7rem;margin:.2rem;background:#153649;color:#ddf7ff;border:1px solid #759eae;border-radius:.4rem;touch-action:none}
button:disabled{opacity:.45}
/* iOS long press must steer, not select a label or open the system callout. */
.flight-steering,.flight-steering *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.flight-steering{display:inline-flex;align-items:center;gap:.23rem}
.flight-steering button{margin:.2rem 0;padding-inline:.62rem}
.flight-steering button:active{background:#28665e;border-color:#b1ffe9}
[hidden]{display:none!important}
section{margin-block:1rem;padding:1rem;border:1px solid #395c70;border-radius:.6rem}
canvas{display:block;width:100%;aspect-ratio:4/5;background:#090f1e;border:1px solid #395c70}
#status{min-height:3em}
#dock-radio{display:flex;align-items:center;gap:.75rem;margin-block:.65rem}
#dock-radio img{width:60px;height:60px;object-fit:cover;border:1px solid #6097a1;border-radius:.4rem}
#dock-radio p{margin:.2rem 0}
.fleet-title-row{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin:0 0 .5rem}
.fleet-title-row h2{margin:0;font-size:1.1rem}
.fleet-title-row button{margin:0;min-height:40px}
.flight-key{color:#a5f8de;font-size:.85rem;margin:.4rem 0 .65rem}
</style>
<h1 id="title">Online Battle Fleet Map</h1>
<p>Online beta · shared flight and docking. No combat, career rewards or damage.</p>
<nav><a href="./galaxy-map.html">Galaxy Map</a> <a id="carrier-deck" href="./carrier.html">Deck Map</a> <a id="private-hangar" href="./index.html?hangar=carrier">Private Hangar</a></nav>
<p id="status" role="status">Choose a test pilot.</p>
<section id="hangar" hidden aria-label="Your selected fighter">
 <h2 id="hangar-title">Your fighter</h2><p id="hangar-ship"></p>
 <button id="enter" disabled>Go to launch deck</button>
</section>
<section id="fleet" hidden aria-label="Online Battle Fleet Map preview">
 <div class="fleet-title-row"><h2>Battle Fleet Map</h2><button id="fleet-view" type="button" aria-pressed="false">Fleet overview</button></div>
 <canvas width="480" height="600" aria-label="Carrier fleet positions"></canvas>
 <p class="flight-key"><strong>YOU</strong> marks your fighter. Hold ▲ to thrust and ◀ or ▶ to turn.</p>
 <aside id="dock-radio" aria-label="Dock Control" hidden>
  <img src="./dockmaster-vale.webp?v=152" width="60" height="60" alt="">
  <div><strong>Elias Vale · Dock Control</strong><p id="dock-radio-text" role="status"></p>
   <button id="dock-radio-replay" type="button" hidden>Play radio</button></div>
  <audio id="dock-radio-voice" src="./dock-clearance-radio.mp3?v=154" preload="none"></audio>
 </aside>
 <div role="group" aria-label="Flight controls">
  <button id="launch" disabled>Launch</button><button id="leave" disabled>Disconnect</button>
  <button id="rejoin" disabled>Reconnect</button>
  <button id="dock" disabled>Request Docking</button><button id="store" disabled>Store Inside</button>
  <span class="flight-steering" role="group" aria-label="Hold to fly"><button data-key="ArrowLeft" aria-label="Turn left">◀</button><button data-key="ArrowUp" aria-label="Thrust">▲ Thrust</button><button data-key="ArrowRight" aria-label="Turn right">▶</button></span>
 </div>
</section>
</html>
