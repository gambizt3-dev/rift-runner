<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080917">
<title>Rift Runner</title>
<meta name="description" content="Fly a small ship through a single arena. Dodge the swarm and survive.">
<link rel="stylesheet" href="style.css">
<script src="game.js" defer></script>
</head>
<body>
<main class="cabinet">
<header class="topline">
<div class="brand"><span aria-hidden="true" class="mark">◆</span><h1>RIFT<span>RUNNER</span></h1></div>
<div class="settings" aria-label="Game settings">
<label class="toggle"><input id="sound-on" type="checkbox" checked> <span>Sound</span></label>
<label class="toggle"><input id="screen-shake" type="checkbox" checked> <span>Shake</span></label>
<button class="sound-test" id="test-sound" type="button" aria-describedby="sound-status">Test sound</button>
</div>
</header>
<section class="machine" aria-label="Single-stage space shooter">
<aside id="hud" aria-live="off" aria-label="Run status"></aside>
<div class="stage">
<canvas id="game" aria-label="Rift Runner game field" tabindex="0">A browser with Canvas support is required.</canvas>
<div id="overlay"></div>
</div>
</section>
<div class="flight-deck" id="flight-deck" data-mode="auto" aria-label="Touch flight controls">
<div class="pad-side"><div class="dpad" id="move-pad" role="group" aria-label="Eight-way movement" aria-describedby="move-guide"><button type="button" data-move="nw" aria-label="Steer Northwest">↖</button><button type="button" data-move="n" aria-label="Steer North">↑</button><button type="button" data-move="ne" aria-label="Steer Northeast">↗</button><button type="button" data-move="w" aria-label="Steer West">←</button><span class="dpad-centre" aria-hidden="true">◆</span><button type="button" data-move="e" aria-label="Steer East">→</button><button type="button" data-move="sw" aria-label="Steer Southwest">↙</button><button type="button" data-move="s" aria-label="Steer South">↓</button><button type="button" data-move="se" aria-label="Steer Southeast">↘</button></div><span id="move-guide">HOLD TO STEER</span></div>
<div class="deck-center"><label class="toggle aim-toggle"><input id="aim-mode" type="checkbox" checked> <span>Auto Aim</span></label><small>TOUCH CONTROLS</small></div>
<div class="pad-side"><button class="pad" id="aim-pad" type="button" aria-label="Aim and fire joystick" aria-describedby="fire-guide"><span class="thumb" aria-hidden="true"></span></button><span id="fire-guide">AIM + FIRE</span></div>
</div>
<div class="sound-feedback" id="sound-status" role="status"></div>
<footer id="controls"><span id="touch-help">Hold a direction. Release to coast.</span><span><b>Desktop</b> WASD to fly · arrows or hold mouse to aim + fire</span></footer>
</main>
</body>
</html>
